<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Curalle Intro 16:9</title>
<style>
@font-face{font-family:Playfair;font-weight:700;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2)}
@font-face{font-family:Playfair;font-weight:900;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-900-normal.woff2)}
@font-face{font-family:Playfair;font-weight:700;font-style:italic;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-italic.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
:root{--paper:#F3ECDC;--ink:#1B1B1B;--purple:#6A3FA0;--deep:#3E1F6B;--yellow:#FFE14D;--red:#FF3B4E;--cream:#FBF7EE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#07050A}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif}
.abs{position:absolute}
#dark{position:absolute;inset:0;background:radial-gradient(circle at 1340px 540px,#3A0C16 0,#1A060C 38%,#07050A 75%)}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
#light{position:absolute;inset:0;background:radial-gradient(circle at 1340px 540px,#FFFDF7 0,var(--cream) 30%,var(--paper) 80%)}
#flash{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
canvas{position:absolute;inset:0}
.kicker{font-weight:800;font-size:24px;letter-spacing:7px;text-transform:uppercase}
.h1{font-family:Playfair;font-weight:900;font-size:104px;line-height:1.04;letter-spacing:-1.5px;white-space:nowrap}
.mono{font-family:'DejaVu Sans Mono',monospace;font-size:20px;letter-spacing:3px}
.hl{background-image:linear-gradient(transparent 58%,var(--yellow) 58%,var(--yellow) 92%,transparent 92%);background-repeat:no-repeat;background-size:0% 100%;padding:0 12px;margin:0 -12px}
#lens{position:absolute;left:1040px;top:240px;width:600px;height:600px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#fff 0,var(--cream) 60%,#EFE4CC 100%);
  box-shadow:0 0 0 10px #fff,0 0 0 12px rgba(106,63,160,.35),0 40px 80px rgba(62,31,107,.28)}
#lens img{position:absolute;left:50%;bottom:0;width:560px;transform:translateX(-50%)}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.12;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.35) 100%)}
#letterbox{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 #000}
</style>
</head>
<body>
<div id="stage">
  <div id="dark"></div>
  <div id="scan"></div>
  <div id="light"></div>

  <!-- microscope reticle (act 1) -->
  <svg id="reticle" class="abs" style="left:990px;top:190px" width="700" height="700" viewBox="0 0 700 700">
    <g id="retRot" style="transform-origin:350px 350px">
      <circle id="retC" cx="350" cy="350" r="318" fill="none" stroke="#FF3B4E" stroke-width="2.5" stroke-opacity=".75"/>
      <circle cx="350" cy="350" r="290" fill="none" stroke="#FF3B4E" stroke-width="1" stroke-opacity=".35" stroke-dasharray="3 9"/>
      <g id="ticks" stroke="#FF3B4E" stroke-opacity=".7" stroke-width="2"></g>
    </g>
    <path d="M350 20 V120 M350 580 V680 M20 350 H120 M580 350 H680" stroke="#FF3B4E" stroke-opacity=".6" stroke-width="2"/>
    <circle cx="350" cy="350" r="6" fill="none" stroke="#FF3B4E" stroke-opacity=".8" stroke-width="2"/>
  </svg>

  <div id="lens"><img src="assets/founder.png"></div>

  <canvas id="cv" width="1920" height="1080"></canvas>

  <!-- HUD (act 1) -->
  <div id="hud">
    <div class="abs mono" style="left:120px;top:84px;color:rgba(255,255,255,.55)" data-in="0.2" data-fx="fade">SPECIMEN 07 &nbsp;·&nbsp; ×1000 &nbsp;·&nbsp; <span id="clock">00:00:00</span></div>
    <div class="abs mono" id="alert" style="left:1040px;top:900px;color:#FF3B4E;font-weight:bold" data-in="1.4" data-fx="fade">▲ PATHOGEN ALERT &nbsp;— &nbsp;UNKNOWN STRAIN</div>
    <div class="abs mono" style="right:120px;top:84px;color:rgba(255,255,255,.55)" data-in="0.2" data-fx="fade">● REC</div>
  </div>

  <!-- ACT 1 copy -->
  <div id="act1" class="abs" style="left:120px;top:330px">
    <div class="kicker" style="color:#FF6B78" data-in="0.35" data-fx="up">What most people see</div>
    <div class="h1" style="color:#F4EEF0;margin-top:26px" data-in="0.55" data-fx="up">Some see bacteria</div>
    <div class="h1" style="color:#F4EEF0" data-in="0.75" data-fx="up">as a <span id="threat" style="color:#FF3B4E;display:inline-block;position:relative">threat.</span></div>
  </div>

  <!-- ACT 2 copy -->
  <div id="act2" class="abs" style="left:120px;top:330px">
    <div class="kicker" style="color:var(--purple)" data-in="3.95" data-fx="up">What I see</div>
    <div class="h1" style="color:var(--ink);margin-top:26px" data-in="4.1" data-fx="up">I see them as</div>
    <div class="h1" style="color:var(--purple)" data-in="4.3" data-fx="up">a <span class="hl" data-hl="4.85">solution.</span></div>
  </div>

  <!-- founder caption -->
  <div id="cap" class="abs" style="left:1130px;width:420px;top:870px;text-align:center;padding:14px 0 16px;border-radius:999px;background:rgba(251,247,238,.92);box-shadow:0 10px 30px rgba(62,31,107,.12)" data-in="4.9" data-fx="up">
    <div style="font-weight:800;font-size:26px;color:var(--ink)">Ts. Dr Muhamad Fareez Ismail</div>
    <div style="font-size:20px;color:#6d6457;margin-top:6px;letter-spacing:2px;text-transform:uppercase">Founder &amp; Chief Scientist</div>
  </div>

  <!-- ACT 3 brand -->
  <div id="act3" class="abs" style="left:120px;top:360px">
    <img src="assets/logo.png" style="width:470px;display:block" data-in="6.25" data-fx="rise">
    <div style="width:120px;height:5px;background:var(--yellow);margin:40px 0 34px;transform-origin:left" id="rule"></div>
    <div style="font-family:Playfair;font-weight:700;font-size:48px;line-height:1.2;color:var(--ink)" data-in="6.55" data-fx="up">The science of <i style="color:var(--purple)">postbiotics</i>.</div>
    <div style="font-size:26px;color:#6d6457;margin-top:16px" data-in="6.75" data-fx="up">Good bacteria, working for healthier skin.</div>
  </div>

  <div id="flash"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,d)=>clamp((t-a)/d);
const out3=x=>1-Math.pow(1-x,3);
const inout=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,x)=>{const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],x))).join(',')})`};
// deterministic PRNG
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};

// reticle ticks
const tk=document.getElementById('ticks');
for(let i=0;i<72;i++){const a=i/72*Math.PI*2,r1=318,r2=i%6?306:292;
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',350+Math.cos(a)*r1);l.setAttribute('y1',350+Math.sin(a)*r1);
  l.setAttribute('x2',350+Math.cos(a)*r2);l.setAttribute('y2',350+Math.sin(a)*r2);tk.appendChild(l);}

// bacteria
const CX=1340,CY=540,N=34;
const bac=[];
for(let i=0;i<N;i++){
  const z=lerp(.55,1.25,rnd());
  const inLens=i<14;
  let x,y;
  if(inLens){const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*250;x=CX+Math.cos(a)*r;y=CY+Math.sin(a)*r;}
  else{x=lerp(40,1900,rnd());y=lerp(40,1040,rnd());if(x<1000&&y>260&&y<760)x+=900*rnd();}
  bac.push({x,y,z,rod:rnd()<.65,len:lerp(34,70,rnd())*z,rad:lerp(13,19,rnd())*z,ang:rnd()*Math.PI,
    ph:rnd()*10,sp:lerp(.6,1.4,rnd()),gold:i%3===0,
    ring:i/N*Math.PI*2+rnd()*.12,rr:370+(i%4)*38+rnd()*18,fl:1+Math.floor(rnd()*3)});
}
bac.sort((a,b)=>a.z-b.z);
const dust=[];for(let i=0;i<70;i++)dust.push({x:rnd()*1920,y:rnd()*1080,r:lerp(1,3.2,rnd()),s:lerp(8,30,rnd()),p:rnd()*9});

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

function drawBac(b,x,y,ang,m,t,vis){
  const {len,rad,z}=b;
  const threatFill=['#FF4D5E','#8A0F22'], goodFill=b.gold?['#FFE38A','#D99A1E']:['#B08AE0','#4E2A88'];
  const c0=mix(threatFill[0],goodFill[0],m), c1=mix(threatFill[1],goodFill[1],m);
  const edge=mix('#FF8A95',b.gold?'#FFF3C4':'#E6D6FA',m);
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  const A=vis*clamp(lerp(.55,1,(z-.55)/.7));ctx.globalAlpha=A;
  if(z<.8)ctx.filter=`blur(${(0.8-z)*9}px)`;
  // flagella
  ctx.strokeStyle=mix('#FF6B78',b.gold?'#E0B04A':'#8E6BC4',m);ctx.lineWidth=2.2*z;ctx.lineCap='round';
  const L=b.rod?len/2+rad:rad;
  for(let k=0;k<b.fl;k++){
    ctx.beginPath();const off=(k-(b.fl-1)/2)*rad*.55;ctx.moveTo(-L+2,off);
    for(let s=1;s<=14;s++){const u=s/14;ctx.lineTo(-L-u*rad*3.6,off*(1+u)+Math.sin(u*9-t*lerp(14,5,m)*b.sp+b.ph+k)*rad*.35*u);}
    ctx.stroke();
  }
  // body
  ctx.shadowColor=m<.5?`rgba(255,40,70,${.7*(1-m*2)})`:(b.gold?`rgba(255,200,80,${(m-.5)*1.2})`:`rgba(150,100,230,${(m-.5)*1.2})`);
  ctx.shadowBlur=28*z;
  const g=ctx.createLinearGradient(0,-rad,0,rad);g.addColorStop(0,c0);g.addColorStop(1,c1);
  ctx.fillStyle=g;ctx.beginPath();
  if(b.rod)ctx.roundRect(-len/2-rad,-rad,len+2*rad,2*rad,rad);else ctx.arc(0,0,rad*1.15,0,Math.PI*2);
  ctx.fill();ctx.shadowBlur=0;
  ctx.lineWidth=2*z;ctx.strokeStyle=edge;ctx.globalAlpha*=.8;ctx.stroke();
  // highlight + cytoplasm specks
  ctx.globalAlpha=A*.45;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.ellipse(-(b.rod?len*.15:0),-rad*.45,(b.rod?len*.45:rad*.6),rad*.2,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha*=.8;ctx.fillStyle=c1;
  for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(Math.sin(k*2.3+b.ph)*(b.rod?len*.4:rad*.5),Math.cos(k*1.7+b.ph)*rad*.4,rad*.13,0,Math.PI*2);ctx.fill();}
  ctx.restore();
}

function fx(el,t){
  const a=+el.dataset.in,k=el.dataset.fx;let o=1,tr='',f='none';
  if(k==='up'){const x=out3(P(t,a,.55));o=P(t,a,.35);tr=`translateY(${(1-x)*40}px)`;f=x<1?`blur(${(1-x)*8}px)`:'none';}
  else if(k==='fade'){o=P(t,a,.3);}
  else if(k==='rise'){const x=P(t,a,.6);o=P(t,a,.25);tr=`translateY(${(1-out3(x))*30}px) scale(${lerp(.92,1,back(x))})`;f=x<1?`blur(${(1-out3(x))*10}px)`:'none';}
  el.style.opacity=o;el.style.transform=tr;el.style.filter=f;
}
const setOut=(el,t,a,d,dy=-30)=>{const x=inout(P(t,a,d));el.style.opacity=1-x;el.style.transform=`translateY(${x*dy}px)`;el.style.filter=x>0?`blur(${x*12}px)`:'none';};

window.render=function(t){
  document.querySelectorAll('[data-in]').forEach(el=>fx(el,t));
  document.querySelectorAll('[data-hl]').forEach(el=>{el.style.backgroundSize=`${out3(P(t,+el.dataset.hl,.5))*100}% 100%`;});

  // ---- act 1 -> act 2 transition (light blooms out of the lens)
  const T0=3.35;
  const bloom=out3(P(t,T0,.75));
  document.getElementById('light').style.clipPath=`circle(${bloom*2300}px at ${CX}px ${CY}px)`;
  document.getElementById('flash').style.opacity=(t>T0?Math.max(0,.3*(1-P(t,T0+.1,.6))*P(t,T0,.1)):0);
  document.getElementById('scan').style.opacity=1-bloom;
  setOut(document.getElementById('act1'),t,T0-.2,.45);
  setOut(document.getElementById('hud'),t,T0-.2,.4,0);
  const R=document.getElementById('reticle');R.style.opacity=(1-P(t,T0,.4))*out3(P(t,0,.6));
  document.getElementById('retRot').style.transform=`rotate(${t*12}deg)`;
  document.getElementById('retC').style.strokeDasharray='2000';document.getElementById('retC').style.strokeDashoffset=2000*(1-out3(P(t,0,1.1)));
  document.getElementById('clock').textContent=`00:00:0${Math.floor(t)}:${String(Math.floor((t%1)*30)).padStart(2,'0')}`;
  document.getElementById('alert').style.visibility=(t>1.4&&(Math.floor(t*3)%2===0||t<1.9))?'visible':'hidden';

  // "threat." glitch
  const th=document.getElementById('threat');
  const gl=t>1.05&&t<3.2&&((t>1.05&&t<1.35)||(Math.sin(t*23)>.93));
  const gx=gl?Math.round(Math.sin(t*97)*8):0;
  th.style.transform=`translateX(${gx}px)`;
  th.style.textShadow=gl?`${-gx*1.2}px 0 #22E1FF, ${gx*1.2}px 0 #FF00AA`:`0 0 40px rgba(255,59,78,${.55*P(t,1.1,.4)})`;

  // lens with founder
  const L=document.getElementById('lens');const lx=P(t,T0+.25,.8);
  L.style.opacity=out3(P(t,T0+.3,.4));L.style.transform=`scale(${lerp(.82,1,back(lx))})`;
  document.querySelector('#lens img').style.transform=`translateX(-50%) translateY(${(1-out3(lx))*40}px) scale(${1+.03*P(t,4,4)})`;

  // act 2 -> act 3
  if(t>=5.95)setOut(document.getElementById('act2'),t,5.95,.4,-40);else{document.getElementById('act2').style.transform='';}
  document.getElementById('act2').style.visibility=t<3.9?'hidden':'visible';
  document.getElementById('act3').style.visibility=t<6.2?'hidden':'visible';
  document.getElementById('rule').style.transform=`scaleX(${out3(P(t,6.5,.5))})`;

  // ---- canvas
  ctx.clearRect(0,0,1920,1080);
  const mG=inout(P(t,T0,1.1));
  // dust motes
  dust.forEach(d=>{ctx.fillStyle=mG<.5?`rgba(255,120,130,${.25*(1-mG*2)})`:`rgba(106,63,160,${.22*(mG-.5)*2})`;
    ctx.beginPath();ctx.arc((d.x+t*d.s)%1920,d.y+Math.sin(t*.8+d.p)*12,d.r,0,Math.PI*2);ctx.fill();});
  const intro=out3(P(t,0,.8));
  bac.forEach((b,i)=>{
    const m=inout(P(t,T0+Math.min(1,Math.hypot(b.x-CX,b.y-CY)/1100)*.35,b.x>CX-320&&b.x<CX+320&&b.y>CY-320&&b.y<CY+320?.7:1.1));
    // threat motion: agitated jitter + drift
    const j=lerp(1,.35,m);
    const tx=b.x+Math.sin(t*2.3*b.sp+b.ph)*26+Math.sin(t*17*b.sp+b.ph*3)*4*j + (1-intro)*(b.x-CX)*.25;
    const ty=b.y+Math.cos(t*1.9*b.sp+b.ph)*20+Math.cos(t*15*b.sp+b.ph*2)*4*j + (1-intro)*(b.y-CY)*.25;
    const ta=b.ang+Math.sin(t*1.3+b.ph)*.6;
    // solution motion: calm orbit around lens
    const ra=b.ring+t*.28;const rr=b.rr+Math.sin(t*1.4+b.ph)*10;
    const gx=CX+Math.cos(ra)*rr, gy=CY+Math.sin(ra)*rr*.92;
    const ga=ra+Math.PI/2;
    // blend along a curved path
    const x=lerp(tx,gx,m)+Math.sin(m*Math.PI)*(gy-ty)*.18, y=lerp(ty,gy,m)-Math.sin(m*Math.PI)*(gx-tx)*.18;
    let da=((ga-ta)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
    const sc=lerp(1,.72,m);
    const save={len:b.len,rad:b.rad};b.len*=sc;b.rad*=sc;
    const vis=intro*(t>6.1?1-.55*out3(P(t,6.1,.8)):1);
    if(vis>0.01)drawBac(b,x,y,ta+da*m,m,t,vis);
    Object.assign(b,save);
  });

  // camera: slow push in act 1, gentle settle afterwards
  const cam=lerp(1,1.045,P(t,0,T0))*(1-bloom)+bloom*lerp(1.02,1,out3(P(t,T0,1.5)));
  document.getElementById('stage').style.transform=`scale(${cam})`;
  // fade from black at head
  document.getElementById('stage').style.opacity=out3(P(t,0,.35));

  const f=Math.floor(t*24);
  document.getElementById('grain').style.transform=`translate(${(f*37)%90-45}px,${(f*53)%90-45}px)`;
};
window.render(0);
</script>
</body>
</html>
